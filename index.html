<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Səhifə 5</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fffaf0; color: #1a1612; }
  body {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh; overflow: hidden;
    font-family: "Segoe UI", sans-serif;
  }
  #page {
    --rows: 15;
    flex: 1; min-height: 0; margin: 0;
    background: #fffaf0;
    display: flex; flex-direction: column; justify-content: center;
    overflow: hidden; color: #1a1612;
  }
  .line {
    flex: 0 1 calc(100% / 16.7);
    min-height: 0;
    display: flex; align-items: center; justify-content: center;
    line-height: 1; white-space: nowrap; direction: rtl;
  }
  .foot { text-align: center; color: #8a7d68; font-size: 12px; padding: 2px 0 8px; }
</style>
</head>
<body>
<div id="page"></div>
<div class="foot">5</div>
<script>
const LINES = ["ﱁﱂﱃﱄﱅﱆﱇﱈ", "ﱉﱊﱋﱌﱍﱎﱏﱐﱑﱒ", "ﱓﱔﱕﱖﱗﱘﱙﱚﱛﱜﱝﱞ", "ﱟﱠﱡﱢﱣﱤﱥﱦﱧﱨ ﱩ", "ﱪﱫﱬﱭﱮﱯﱰﱱﱲﱳﱴﱵ", "ﱶﱷﱸﱹﱺﱻﱼﱽﱾ", "ﱿﲀﲁﲂﲃﲄﲅﲆﲇ", "ﲈﲉﲊﲋﲌﲍﲎﲏﲐﲑ", "ﲒﲓﲔﲕﲖﲗﲘﲙﲚ", "ﲛﲜﲝﲞﲟﲠﲡﲢﲣ", "ﲤﲥﲦﲧﲨﲩﲪﲫ", "ﲬﲭﲮﲯﲰﲱﲲﲳ", "ﲴﲵﲶﲷﲸﲹﲺﲻﲼ", "ﲽﲾﲿﳀﳁﳂﳃﳄﳅ", "ﳆﳇﳈﳉﳊﳋﳌﳍﳎ"];
const board = document.getElementById("page");
function draw() {
  board.style.fontFamily = "QCF5, serif";
  board.replaceChildren();
  for (const text of LINES) {
    const row = document.createElement("div");
    row.className = "line";
    row.textContent = text;
    board.append(row);
  }
  fit();
}
function fit() {
  const h = board.clientHeight;
  const w = board.clientWidth - 16;
  let size = h / 15;
  for (let i = 0; i < 4; i++) {
    board.style.fontSize = size + "px";
    let widest = 0;
    for (const line of board.querySelectorAll(".line")) widest = Math.max(widest, line.scrollWidth);
    if (widest <= w || widest === 0) break;
    size *= (w / widest) * 0.94;
  }
  const phone = matchMedia("(orientation: portrait) and (max-width: 520px)").matches;
  board.style.fontSize = size * (phone ? 1 : 0.9) + "px";
}
new FontFace("QCF5", "url(./fonts/p5.woff2)").load().then((face) => {
  document.fonts.add(face);
  draw();
  setTimeout(fit, 60);
});
window.addEventListener("resize", fit);
</script>
</body>
</html>
