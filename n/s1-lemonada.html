<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lemonada · səhifə 1</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lemonada:wght@400;700&display=block" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100svh; overflow: hidden; background: #fffaf0; color: #142824; }
    #sheet {
      position: fixed; inset: 0; height: 100svh; overflow: hidden;
      padding: calc(2.15rem + env(safe-area-inset-top)) 0.45rem calc(0.3rem + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; justify-content: space-evenly;
      font-family: "Lemonada", "Noto Naskh Arabic", serif;
    }
    .line { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; direction: rtl; white-space: nowrap; line-height: 1; }
    .line.full { justify-content: space-between; }
    .mark { color: #8a6a2e; }
    .hud { position: fixed; z-index: 2; top: 0; left: 0; right: 0; height: calc(2.05rem + env(safe-area-inset-top)); display: flex; align-items: flex-end; gap: 0.15rem; padding: 0 0.25rem 0.15rem; background: #fffaf0; font: 650 0.78rem "Segoe UI", sans-serif; color: #8a6a2e; }
    .hud a { color: #12352c; text-decoration: none; padding: 0.1rem 0.35rem; }
    .hud a.nav { font-size: 1.3rem; line-height: 1; }
    .hud b { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #probe { position: absolute; left: -9999px; top: 0; white-space: nowrap; font-family: "Lemonada", "Noto Naskh Arabic", serif; }
  </style>
</head>
<body>
  <nav class="hud">
    <a href="../index.html?p=1">Siyahı</a>
    <a class="nav" href="./s1-fustat.html">‹</a>
    <b>Lemonada</b>
    <a class="nav" href="./s1-playpen-sans-arabic.html">›</a>
    <span>1/5</span>
  </nav>
  <main id="sheet"></main>
  <span id="probe"></span>
  <script>
    const PAGE = {"n": 1, "surah": "əl-Fatihə", "ar": "الفاتحة", "place": "Məkkə", "range": "1:1–7", "basmala": null, "showTitle": true, "ayahs": [{"s": 1, "a": 1, "t": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ"}, {"s": 1, "a": 2, "t": "ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ"}, {"s": 1, "a": 3, "t": "ٱلرَّحْمَٰنِ ٱلرَّحِيمِ"}, {"s": 1, "a": 4, "t": "مَٰلِكِ يَوْمِ ٱلدِّينِ"}, {"s": 1, "a": 5, "t": "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ"}, {"s": 1, "a": 6, "t": "ٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ"}, {"s": 1, "a": 7, "t": "صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ"}]};
    const FONT = "Lemonada";
    const ar = (n) => String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
    const sheet = document.getElementById("sheet");
    const probe = document.getElementById("probe");
    const measure = (text, px) => { probe.style.fontSize = px + "px"; probe.textContent = text; return probe.getBoundingClientRect().width; };
    function tokensOf(page) {
      const out = [];
      if (page.showTitle) out.push({ text: "سورة " + page.ar, center: true });
      if (page.basmala) out.push({ text: page.basmala, center: true });
      for (const ay of page.ayahs) {
        const words = ay.t.split(/\s+/).filter(Boolean);
        words.forEach((w, i) => out.push({ text: w + (i === words.length - 1 ? " ﴿" + ar(ay.a) + "﴾" : ""), center: false }));
      }
      return out;
    }
    function wrap(tokens, px, width) {
      const lines = []; let cur = [], used = 0; const gap = px * 0.28;
      for (const tok of tokens) {
        if (tok.center) { if (cur.length) lines.push(cur); lines.push([tok.text]); cur = []; used = 0; continue; }
        const w = measure(tok.text, px);
        if (w > width) return null;
        const next = used + (cur.length ? gap : 0) + w;
        if (cur.length && next > width) { lines.push(cur); cur = [tok.text]; used = w; }
        else { cur.push(tok.text); used = next; }
      }
      if (cur.length) lines.push(cur);
      return lines;
    }
    function paint(px, lines) {
      sheet.replaceChildren();
      for (const words of lines) {
        const el = document.createElement("div");
        el.className = "line" + (words.length > 1 ? " full" : "");
        el.style.fontSize = px + "px";
        for (const w of words) {
          const s = document.createElement("span");
          const m = w.match(/^(.*?)( ﴿.+﴾)$/);
          if (m) { s.append(document.createTextNode(m[1])); const k = document.createElement("span"); k.className = "mark"; k.textContent = m[2]; s.append(k); }
          else s.textContent = w;
          el.append(s);
        }
        sheet.append(el);
      }
    }
    function tooWide() {
      return [...sheet.querySelectorAll(".line")].some((l) => l.scrollWidth > l.clientWidth + 1);
    }
    function show() {
      const tokens = tokensOf(PAGE);
      const width = Math.max(40, sheet.clientWidth - 6);
      const height = Math.max(40, sheet.clientHeight);
      let px = Math.min(width / 8, height / 8);
      let lines = null;
      for (let n = 0; n < 28 && px > 8; n++) {
        lines = wrap(tokens, px, width);
        if (lines && lines.length * px * 1.9 <= height) break;
        px *= 0.92;
        lines = null;
      }
      if (!lines) lines = wrap(tokens, 11, width * 2) || [tokens.map((t) => t.text)];
      paint(Math.max(px, 8), lines);
      let guard = 0;
      while (tooWide() && px > 8 && guard < 16) { px *= 0.9; const again = wrap(tokens, px, width); if (!again) break; lines = again; paint(px, lines); guard++; }
    }
    async function start() {
      try { await document.fonts.load('48px "' + FONT + '"'); await document.fonts.load('16px "' + FONT + '"'); } catch (e) {}
      await document.fonts.ready;
      show();
    }
    start();
    document.fonts.addEventListener && document.fonts.addEventListener("loadingdone", () => start());
    window.addEventListener("resize", show);
  </script>
</body>
</html>
