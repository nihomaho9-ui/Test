    #sheet {
      position: fixed; inset: 0;

    .line { flex: 1 1 0; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; direction: rtl; white-space: nowrap; overflow: hidden; }
    .line.full { justify-content: space-between; }

    .hud { position: fixed; z-index: 2; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 0.2rem; padding: calc(0.1rem + env(safe-area-inset-top)) 0.3rem 0.6rem; background: linear-gradient(#fffaf0 55%, rgba(255,250,240,0)); font: 650 0.78rem "Segoe UI", sans-serif; color: #8a6a2e; }
    .hud a { color: #12352c; text-decoration: none; padding: 0.15rem 0.35rem; }

<body>

  <main id="sheet"></main>
  <span id="probe"></span>
  <script>
    const PAGE = {"n": 4, "surah": "əl-Bəqərə", "ar": "البقرة", "place": "Mədinə", "range": "2:17–24", "basmala": null, "showTitle": false, "ayahs": [{"s": 2, "a": 17, "t": "مَثَلُهُمْ كَمَثَلِ ٱلَّذِى ٱسْتَوْقَدَ نَارًا فَلَمَّآ أَضَآءَتْ مَا حَوْلَهُۥ ذَهَبَ ٱللَّهُ بِنُورِهِمْ وَتَرَكَهُمْ فِى ظُلُمَٰتٍ لَّا يُبْصِرُونَ"}, {"s": 2, "a": 18, "t": "صُمٌّۢ بُكْمٌ عُمْىٌ فَهُمْ لَا يَرْجِعُونَ"}, {"s": 2, "a": 19, "t": "أَوْ كَصَيِّبٍ مِّنَ ٱلسَّمَآءِ فِيهِ ظُلُمَٰتٌ وَرَعْدٌ وَبَرْقٌ يَجْعَلُونَ أَصَٰبِعَهُمْ فِىٓ ءَاذَانِهِم مِّنَ ٱلصَّوَٰعِقِ حَذَرَ ٱلْمَوْتِ وَٱللَّهُ مُحِيطٌۢ بِٱلْكَٰفِرِينَ"}, {"s": 2, "a": 20, "t": "يَكَادُ ٱلْبَرْقُ يَخْطَفُ أَبْصَٰرَهُمْ كُلَّمَآ أَضَآءَ لَهُم مَّشَوْا۟ فِيهِ وَإِذَآ أَظْلَمَ عَلَيْهِمْ قَامُوا۟ وَلَوْ شَآءَ ٱللَّهُ لَذَهَبَ بِسَمْعِهِمْ وَأَبْصَٰرِهِمْ إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ"}, {"s": 2, "a": 21, "t": "يَٰٓأَيُّهَا ٱلنَّاسُ ٱعْبُدُوا۟ رَبَّكُمُ ٱلَّذِى خَلَقَكُمْ وَٱلَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ"}, {"s": 2, "a": 22, "t": "ٱلَّذِى جَعَلَ لَكُمُ ٱلْأَرْضَ فِرَٰشًا وَٱلسَّمَآءَ بِنَآءً وَأَنزَلَ مِنَ ٱلسَّمَآءِ مَآءً فَأَخْرَجَ بِهِۦ مِنَ ٱلثَّمَرَٰتِ رِزْقًا لَّكُمْ فَلَا تَجْعَلُوا۟ لِلَّهِ أَندَادًا وَأَنتُمْ تَعْلَمُونَ"}, {"s": 2, "a": 23, "t": "وَإِن كُنتُمْ فِى رَيْبٍ مِّمَّا نَزَّلْنَا عَلَىٰ عَبْدِنَا فَأْتُوا۟ بِسُورَةٍ مِّن مِّثْلِهِۦ وَٱدْعُوا۟ شُهَدَآءَكُم مِّن دُونِ ٱللَّهِ إِن كُنتُمْ صَٰدِقِينَ"}, {"s": 2, "a": 24, "t": "فَإِن لَّمْ تَفْعَلُوا۟ وَلَن تَفْعَلُوا۟ فَٱتَّقُوا۟ ٱلنَّارَ ٱلَّتِى وَقُودُهَا ٱلنَّاسُ وَٱلْحِجَارَةُ أُعِدَّتْ لِلْكَٰفِرِينَ"}]};
    const FONT = "Noto Naskh Arabic";
    const ar = (n) => String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
    const sheet = document.getElementById("sheet");
    const probe = document.getElementById("probe");
    function measure(text, px) {
      probe.style.font = px + "px " + probe.style.fontFamily;
      probe.textContent = text;
      return probe.offsetWidth;
    }
    function tokensOf(page) {
      const out = [];
      if (page.showTitle) out.push({ text: "سورة " + page.ar, center: true });
      if (page.basmala) out.push({ text: page.basmala, center: true });
      for (const ay of page.ayahs) {
        const words = ay.t.split(/\s+/).filter(Boolean);
        words.forEach((w, i) => out.push({ text: w + (i === words.length - 1 ? " ﴿" + ar(ay.a) + "﴾" : ""), center: false }));
      }
      return out;
    }
    function wrap(tokens, px, width) {
      const lines = [];
      let cur = [], used = 0;
      const gap = px * 0.35;
      for (const tok of tokens) {
        if (tok.center) {
          if (cur.length) { lines.push({ words: cur, center: false }); cur = []; used = 0; }
          lines.push({ words: [tok.text], center: true });
          continue;
        }
        const w = measure(tok.text, px);
        if (w > width) return null;
        const next = used + (cur.length ? gap : 0) + w;
        if (cur.length && next > width) { lines.push({ words: cur, center: false }); cur = [tok.text]; used = w; }
        else { cur.push(tok.text); used = next; }
      }
      if (cur.length) lines.push({ words: cur, center: false });
      return lines;
    }
    function show() {
      const tokens = tokensOf(PAGE);
      const width = sheet.clientWidth - 4;
      const height = sheet.clientHeight;
      let lo = 8, hi = Math.min(width / 4, height / 4), best = null;
      for (let i = 0; i < 16; i++) {
        const mid = (lo + hi) / 2;
        const lines = wrap(tokens, mid, width);
        if (lines && lines.length * mid * 1.15 <= height) { best = { px: mid, lines }; lo = mid; }
        else hi = mid;
      }
      if (!best) best = { px: 12, lines: wrap(tokens, 12, width) || [{ words: ["…"], center: true }] };
      sheet.replaceChildren();
      for (const line of best.lines) {
        const el = document.createElement("div");
        el.className = "line" + (!line.center && line.words.length > 1 ? " full" : "");
        el.style.fontSize = best.px + "px";
        line.words.forEach((w) => {
          const s = document.createElement("span");
          const m = w.match(/^(.*?)( ﴿.+﴾)$/);
          if (m) { s.append(m[1]); const k = document.createElement("span"); k.className = "mark"; k.textContent = m[2]; s.append(k); }
          else s.textContent = w;
          el.append(s);
        });
        sheet.append(el);
      }
    }
    document.fonts.ready.then(() => { show(); setTimeout(show, 300); });
    window.addEventListener("resize", show);
  </script>
