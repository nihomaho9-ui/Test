  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100svh; overflow: hidden; background: #fffaf0; color: #142824; }
    #sheet {
      position: fixed; left: 0; right: 0; top: 0; height: 100svh; overflow: hidden;
      padding: calc(2.15rem + env(safe-area-inset-top)) 0.55rem calc(0.35rem + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; justify-content: space-evenly;
      font-family: "Aref Ruqaa Ink", "Amiri Quran", serif;
    }
    .line {
      flex: 1 1 auto; min-height: 0; width: 100%;
      display: flex; align-items: center; justify-content: center;
      direction: rtl; white-space: nowrap; line-height: 1;
    }
    .line.full { justify-content: space-between; }
    .mark { color: #8a6a2e; }
    .hud {
      position: fixed; z-index: 2; top: 0; left: 0; right: 0; height: 2.05rem;
      display: flex; align-items: center; gap: 0.15rem;
      padding: env(safe-area-inset-top) 0.25rem 0;
      background: #fffaf0; font: 650 0.78rem "Segoe UI", sans-serif; color: #8a6a2e;
    }
    .hud a { color: #12352c; text-decoration: none; padding: 0.1rem 0.35rem; }
    .hud a.nav { font-size: 1.3rem; line-height: 1; }
    .hud b { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #probe { position: absolute; left: -9999px; top: 0; white-space: nowrap; visibility: hidden; font-family: "Aref Ruqaa Ink", serif; }
  </style>

<body>
  <nav class="hud">
    <a href="../index.html?p=5">Siyahı</a>
    <a class="nav" href="./s5-aref-ruqaa.html">‹</a>
    <b>Aref Ruqaa Ink</b>
    <a class="nav" href="./s5-noto-kufi-arabic.html">›</a>
    <span>5/5</span>
  </nav>
  <main id="sheet"></main>
  <span id="probe"></span>
  <script>
    const PAGE = {"n": 5, "surah": "əl-Bəqərə", "ar": "البقرة", "place": "Mədinə", "range": "2:25–29", "basmala": null, "showTitle": false, "ayahs": [{"s": 2, "a": 25, "t": "وَبَشِّرِ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ أَنَّ لَهُمْ جَنَّٰتٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ كُلَّمَا رُزِقُوا۟ مِنْهَا مِن ثَمَرَةٍ رِّزْقًا قَالُوا۟ هَٰذَا ٱلَّذِى رُزِقْنَا مِن قَبْلُ وَأُتُوا۟ بِهِۦ مُتَشَٰبِهًا وَلَهُمْ فِيهَآ أَزْوَٰجٌ مُّطَهَّرَةٌ وَهُمْ فِيهَا خَٰلِدُونَ"}, {"s": 2, "a": 26, "t": "إِنَّ ٱللَّهَ لَا يَسْتَحْىِۦٓ أَن يَضْرِبَ مَثَلًا مَّا بَعُوضَةً فَمَا فَوْقَهَا فَأَمَّا ٱلَّذِينَ ءَامَنُوا۟ فَيَعْلَمُونَ أَنَّهُ ٱلْحَقُّ مِن رَّبِّهِمْ وَأَمَّا ٱلَّذِينَ كَفَرُوا۟ فَيَقُولُونَ مَاذَآ أَرَادَ ٱللَّهُ بِهَٰذَا مَثَلًا يُضِلُّ بِهِۦ كَثِيرًا وَيَهْدِى بِهِۦ كَثِيرًا وَمَا يُضِلُّ بِهِۦٓ إِلَّا ٱلْفَٰسِقِينَ"}, {"s": 2, "a": 27, "t": "ٱلَّذِينَ يَنقُضُونَ عَهْدَ ٱللَّهِ مِنۢ بَعْدِ مِيثَٰقِهِۦ وَيَقْطَعُونَ مَآ أَمَرَ ٱللَّهُ بِهِۦٓ أَن يُوصَلَ وَيُفْسِدُونَ فِى ٱلْأَرْضِ أُو۟لَٰٓئِكَ هُمُ ٱلْخَٰسِرُونَ"}, {"s": 2, "a": 28, "t": "كَيْفَ تَكْفُرُونَ بِٱللَّهِ وَكُنتُمْ أَمْوَٰتًا فَأَحْيَٰكُمْ ثُمَّ يُمِيتُكُمْ ثُمَّ يُحْيِيكُمْ ثُمَّ إِلَيْهِ تُرْجَعُونَ"}, {"s": 2, "a": 29, "t": "هُوَ ٱلَّذِى خَلَقَ لَكُم مَّا فِى ٱلْأَرْضِ جَمِيعًا ثُمَّ ٱسْتَوَىٰٓ إِلَى ٱلسَّمَآءِ فَسَوَّىٰهُنَّ سَبْعَ سَمَٰوَٰتٍ وَهُوَ بِكُلِّ شَىْءٍ عَلِيمٌ"}]};
    const ar = (n) => String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
    const sheet = document.getElementById("sheet");
    const probe = document.getElementById("probe");
    const measure = (text, px) => { probe.style.fontSize = px + "px"; probe.textContent = text; return probe.offsetWidth; };
    function tokensOf(page) {
      const out = [];
      if (page.showTitle) out.push({ text: "سورة " + page.ar, center: true });
      if (page.basmala) out.push({ text: page.basmala, center: true });
      for (const ay of page.ayahs) {
        const words = ay.t.split(/\s+/).filter(Boolean);
        words.forEach((w, i) => out.push({ text: w + (i === words.length - 1 ? " ﴿" + ar(ay.a) + "﴾" : ""), center: false }));
      }
      return out;
    }
    function wrap(tokens, px, width) {
      const lines = []; let cur = [], used = 0; const gap = px * 0.32;
      for (const tok of tokens) {
        if (tok.center) {
          if (cur.length) lines.push(cur);
          lines.push([tok.text]); cur = []; used = 0; continue;
        }
        const w = measure(tok.text, px);
        if (w > width) return null;
        const next = used + (cur.length ? gap : 0) + w;
        if (cur.length && next > width) { lines.push(cur); cur = [tok.text]; used = w; }
        else { cur.push(tok.text); used = next; }
      }
      if (cur.length) lines.push(cur);
      return lines;
    }
    function show() {
      const tokens = tokensOf(PAGE);
      const width = Math.max(40, sheet.clientWidth - 2);
      const height = Math.max(40, sheet.clientHeight);
      let lo = 8, hi = Math.min(width / 6, height / 5), best = null;
      for (let i = 0; i < 18; i++) {
        const mid = (lo + hi) / 2;
        const lines = wrap(tokens, mid, width);
        if (lines && lines.length * mid * 1.85 <= height) { best = { px: mid, lines }; lo = mid; }
        else hi = mid;
      }
      if (!best) {
        const lines = wrap(tokens, lo, width) || [tokens.map((t) => t.text)];
        best = { px: lo, lines };
      }
      sheet.replaceChildren();
      for (const words of best.lines) {
        const el = document.createElement("div");
        el.className = "line" + (words.length > 1 ? " full" : "");
        el.style.fontSize = best.px + "px";
        for (const w of words) {
          const s = document.createElement("span");
          const m = w.match(/^(.*?)( ﴿.+﴾)$/);
          if (m) { s.append(document.createTextNode(m[1])); const k = document.createElement("span"); k.className = "mark"; k.textContent = m[2]; s.append(k); }
          else s.textContent = w;
          el.append(s);
        }
        sheet.append(el);
      }
    }
    const go = () => requestAnimationFrame(show);
    document.fonts.ready.then(go);
    document.fonts.addEventListener && document.fonts.addEventListener("loadingdone", go);
    window.addEventListener("resize", go);
    setTimeout(go, 250);
  </script>
</body>
