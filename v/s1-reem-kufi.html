<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Reem Kufi · səhifə 1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;700&display=swap"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fbf7ee; color: #1a1612; }
  body { height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; font-family: "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; height: 36px; padding: 0 6px; color: #6a5e4c; font-size: 13px; }
  header a { color: #8a7d68; text-decoration: none; font-size: 22px; padding: 0 8px; }
  header b { flex: 1; text-align: center; font-weight: 550; font-size: 13px; white-space: nowrap; overflow: hidden; }
  #page {
    flex: 1; min-height: 0; margin: 0 10px 8px;
    display: flex; flex-direction: column; justify-content: space-evenly;
    overflow: hidden; direction: rtl;
    font-family: "Reem Kufi", "Noto Naskh Arabic", serif;
  }
  .line { display: flex; align-items: center; justify-content: space-between; width: 100%; white-space: nowrap; line-height: 1; }
  .line.head, .line.basmala, .line.short { justify-content: center; }
  .line.head { color: #1d3c34; }
  .num { color: #8a6a2e; font-size: 0.72em; margin-inline-start: 0.2em; }
</style>
</head>
<body>
<header>
  <a href="../index.html">‹</a>
  <a href="./s1-noto-kufi-arabic.html?v=7">‹</a>
  <b>Reem Kufi</b>
  <a href="./s1-kufam.html?v=7">›</a>
</header>
<div id="page"></div>
<script>
const LINES = [{"t": "h", "s": "سورة الفاتحة"}, {"t": "l", "w": [{"w": "بِسْمِ", "n": ""}, {"w": "ٱللَّهِ", "n": ""}, {"w": "ٱلرَّحْمَـٰنِ", "n": ""}, {"w": "ٱلرَّحِيمِ", "n": "١"}]}, {"t": "l", "w": [{"w": "ٱلْحَمْدُ", "n": ""}, {"w": "لِلَّهِ", "n": ""}, {"w": "رَبِّ", "n": ""}, {"w": "ٱلْعَـٰلَمِينَ", "n": "٢"}]}, {"t": "l", "w": [{"w": "ٱلرَّحْمَـٰنِ", "n": ""}, {"w": "ٱلرَّحِيمِ", "n": "٣"}, {"w": "مَـٰلِكِ", "n": ""}, {"w": "يَوْمِ", "n": ""}, {"w": "ٱلدِّينِ", "n": "٤"}]}, {"t": "l", "w": [{"w": "إِيَّاكَ", "n": ""}, {"w": "نَعْبُدُ", "n": ""}, {"w": "وَإِيَّاكَ", "n": ""}, {"w": "نَسْتَعِينُ", "n": "٥"}, {"w": "ٱهْدِنَا", "n": ""}]}, {"t": "l", "w": [{"w": "ٱلصِّرَٰطَ", "n": ""}, {"w": "ٱلْمُسْتَقِيمَ", "n": "٦"}, {"w": "صِرَٰطَ", "n": ""}, {"w": "ٱلَّذِينَ", "n": ""}, {"w": "أَنْعَمْتَ", "n": ""}]}, {"t": "l", "w": [{"w": "عَلَيْهِمْ", "n": ""}, {"w": "غَيْرِ", "n": ""}, {"w": "ٱلْمَغْضُوبِ", "n": ""}, {"w": "عَلَيْهِمْ", "n": ""}]}, {"t": "l", "w": [{"w": "وَلَا", "n": ""}, {"w": "ٱلضَّآلِّينَ", "n": "٧"}]}];
const FONT = "Reem Kufi";
const page = document.getElementById("page");
function build() {
  page.replaceChildren();
  page.style.fontFamily = '"' + FONT + '", "Noto Naskh Arabic", serif';
  for (const ln of LINES) {
    const row = document.createElement("div");
    if (ln.t === "h") { row.className = "line head"; row.textContent = ln.s; }
    else if (ln.t === "b") { row.className = "line basmala"; row.textContent = ln.s; }
    else {
      row.className = "line" + (ln.w.length < 4 ? " short" : "");
      ln.w.forEach((word) => {
        const s = document.createElement("span");
        s.textContent = word.w;
        if (word.n) {
          const n = document.createElement("span");
          n.className = "num";
          n.textContent = word.n;
          s.append(n);
        }
        row.append(s);
      });
    }
    page.append(row);
  }
}
function fit() {
  const height = page.clientHeight;
  const width = page.clientWidth;
  let px = Math.max(14, height / (LINES.length * 2.05));
  page.style.fontSize = px + "px";
  for (let i = 0; i < 16; i++) {
    const over = [...page.children].some((el) => el.scrollWidth > width + 1) || page.scrollHeight > height + 1;
    if (!over) break;
    px *= 0.92;
    page.style.fontSize = px + "px";
  }
}
async function start() {
  build();
  try { await document.fonts.load('32px "' + FONT + '"'); } catch (e) {}
  await document.fonts.ready;
  fit();
}
start();
window.addEventListener("resize", fit);
</script>
</body>
</html>
