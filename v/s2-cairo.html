<title>Cairo · səhifə 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #efe6d2; color: #1c1914; }
  .hud { position: fixed; z-index: 2; top: 0; left: 0; right: 0; height: 36px; display: flex; align-items: center; background: #efe6d2; font: 650 12px "Segoe UI", sans-serif; color: #6d5a32; }
  .hud a { color: #1d3c34; text-decoration: none; padding: 6px 8px; }
  .hud a.nav { font-size: 20px; line-height: 1; }
  .hud b { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; }
  #page {
    position: fixed; top: 40px; left: 8px; right: 8px; bottom: 8px;
    background: #fffaf0;
    border: 2px solid #1d3c34;
    box-shadow: inset 0 0 0 3px #fffaf0, inset 0 0 0 4.5px #b9975b;
    padding: 8px 12px 10px;
    overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-evenly;
  }
  .banner {
    align-self: center; min-width: 58%; text-align: center;
    border: 1px solid #b9975b; border-radius: 999px;
    color: #1d3c34; padding: 0.05em 0.8em; margin: 0.1em 0;
  }
  .basmala { text-align: center; }
  .line { width: 100%; display: flex; justify-content: space-between; align-items: center; direction: rtl; white-space: nowrap; } .line.mid { justify-content: center; }
  .ayah {
    display: inline-block; width: 1.35em; height: 1.35em; line-height: 1.2em;
    border: 1px solid #8a6a2e; border-radius: 50%; color: #8a6a2e;
    font-size: 0.48em; text-align: center; vertical-align: middle; margin: 0 0.12em;
  }
  #probe { position: absolute; left: -9999px; top: 0; white-space: nowrap; visibility: hidden; font-family: "Cairo", "Noto Naskh Arabic", serif; }
</style>
</head>
<body>
<nav class="hud">
  <a href="../index.html?p=2">Siyahı</a>
  <a class="nav" href="./s2-noto-sans-arabic.html?v=5">‹</a>
  <b>Cairo</b>
  <a class="nav" href="./s2-tajawal.html?v=5">›</a>
  <span style="padding-right:8px">2/5</span>
</nav>
<div id="page"></div>
<span id="probe"></span>
<script>
const PAGE = {"n": 2, "surah": "əl-Bəqərə", "ar": "البقرة", "place": "Mədinə", "range": "2:1–5", "basmala": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "showTitle": true, "ayahs": [{"s": 2, "a": 1, "t": "الٓمٓ"}, {"s": 2, "a": 2, "t": "ذَٰلِكَ ٱلْكِتَٰبُ لَا رَيْبَ فِيهِ هُدًى لِّلْمُتَّقِينَ"}, {"s": 2, "a": 3, "t": "ٱلَّذِينَ يُؤْمِنُونَ بِٱلْغَيْبِ وَيُقِيمُونَ ٱلصَّلَوٰةَ وَمِمَّا رَزَقْنَٰهُمْ يُنفِقُونَ"}, {"s": 2, "a": 4, "t": "وَٱلَّذِينَ يُؤْمِنُونَ بِمَآ أُنزِلَ إِلَيْكَ وَمَآ أُنزِلَ مِن قَبْلِكَ وَبِٱلْـَٔاخِرَةِ هُمْ يُوقِنُونَ"}, {"s": 2, "a": 5, "t": "أُو۟لَٰٓئِكَ عَلَىٰ هُدًى مِّن رَّبِّهِمْ وَأُو۟لَٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ"}]};
const FONT = "Cairo";
const LH = 1.85;
const ar = (n) => String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
const pageEl = document.getElementById("page");
const probe = document.getElementById("probe");
probe.style.fontFamily = '"' + FONT + '", "Noto Naskh Arabic", serif';
const CAN = new Set("بتثجحخسشصضطظعغفقكلمنهيئىةںڣڤگچپ".split(""));
const measure = (text, px) => { probe.style.fontSize = px + "px"; probe.textContent = text; return probe.getBoundingClientRect().width; };
function clusters(word) {
  const out = [];
  for (const ch of word) {
    if (/\p{M}/u.test(ch) && out.length) out[out.length - 1] += ch;
    else out.push(ch);
  }
  return out;
}
function base(cluster) { return cluster.normalize("NFD").replace(/\p{M}/gu, ""); }
function spots(word) {
  const c = clusters(word);
  const idx = [];
  for (let i = 0; i < c.length - 1; i++) if (CAN.has(base(c[i]))) idx.push(i);
  return { c, idx };
}
function stretch(word, n) {
  const { c, idx } = spots(word);
  if (!idx.length || n <= 0) return word;
  const extra = idx.map(() => 0);
  for (let k = 0; k < n; k++) extra[k % idx.length]++;
  const parts = c.slice();
  for (let i = idx.length - 1; i >= 0; i--) parts[idx[i]] += "ـ".repeat(extra[i]);
  return parts.join("");
}
function plain(token) { return token.w; }
function tokens() {
  const head = [];
  if (PAGE.showTitle) head.push({ kind: "banner", t: "سورة " + PAGE.ar });
  if (PAGE.basmala) head.push({ kind: "basmala", t: PAGE.basmala });
  const words = [];
  for (const ay of PAGE.ayahs) {
    const ws = ay.t.split(/\s+/).filter(Boolean);
    ws.forEach((w, i) => words.push({ w, a: i === ws.length - 1 ? ay.a : 0 }));
  }
  return { head, words };
}
function shown(tok, px, extra) {
  const body = stretch(tok.w, extra || 0);
  const mark = tok.a ? " " + ar(tok.a) : "";
  return body + mark;
}
function widthOf(line, px) {
  const gap = px * 0.28;
  let w = 0;
  line.forEach((tok, i) => {
    w += measure(stretch(tok.w, tok.k || 0), px);
    if (tok.a) w += px * 0.95;
    if (i) w += gap;
  });
  return w;
}
function wrap(words, px, width) {
  const lines = []; let cur = [], used = 0; const gap = px * 0.28;
  for (const src of words) {
    const tok = { w: src.w, a: src.a, k: 0 };
    const ww = measure(tok.w, px) + (tok.a ? px * 0.95 : 0);
    if (ww > width) return null;
    if (cur.length && used + gap + ww > width) { lines.push(cur); cur = [tok]; used = ww; }
    else { if (cur.length) used += gap; cur.push(tok); used += ww; }
  }
  if (cur.length) lines.push(cur);
  return lines;
}
function rebalance(lines, px, width) {
  for (let n = 0; n < 10 && lines.length > 1; n++) {
    const last = lines.at(-1), prev = lines.at(-2);
    if (prev.length < 2 || widthOf(last, px) >= width * 0.62) break;
    const moved = { ...prev[prev.length - 1], k: 0 };
    if (widthOf(last.concat(moved), px) > width) break;
    prev.pop(); last.unshift(moved);
  }
  return lines;
}
function fill(lines, px, width) {
  for (const line of lines) {
    if (line.length < 2) { line.forEach((t) => t.k = 0); continue; }
    let guard = 0;
    while (widthOf(line, px) < width * 0.9 && guard < 50) {
      const order = line.map((t, i) => ({ i, s: spots(t.w).idx.length })).filter((x) => x.s).sort((a, b) => (a.i % 2) - (b.i % 2));
      if (!order.length) break;
      const before = widthOf(line, px);
      line[order[guard % order.length].i].k++;
      if (widthOf(line, px) > width * 0.93) { line[order[guard % order.length].i].k--; break; }
      if (widthOf(line, px) <= before) break;
      guard++;
    }
  }
  return lines;
}
function paint(px, head, lines) {
  pageEl.replaceChildren();
  pageEl.style.fontFamily = '"' + FONT + '", "Noto Naskh Arabic", serif';
  pageEl.style.fontSize = px + "px";
  for (const h of head) {
    const el = document.createElement("div");
    el.className = h.kind;
    el.style.fontSize = px + "px";
    el.style.lineHeight = String(LH);
    el.textContent = h.t;
    pageEl.append(el);
  }
  for (const line of lines) {
    const el = document.createElement("div");
    el.className = "line" + (line.length < 2 ? " mid" : "");
    el.style.fontSize = px + "px";
    el.style.lineHeight = String(LH);
    line.forEach((tok, i) => {
      if (i) el.append(document.createTextNode(" "));
      el.append(document.createTextNode(stretch(tok.w, tok.k || 0)));
      if (tok.a) {
        const m = document.createElement("span");
        m.className = "ayah";
        m.textContent = ar(tok.a);
        el.append(m);
      }
    });
    pageEl.append(el);
  }
}
function fit() {
  const { head, words } = tokens();
  const height = Math.max(180, pageEl.clientHeight || window.innerHeight - 56);
  const width = Math.max(150, pageEl.clientWidth - 8);
  let lo = 13, hi = Math.min(PAGE.n === 1 ? 34 : 26, width / 11), best = null;
  for (let i = 0; i < 12; i++) {
    const mid = (lo + hi) / 2;
    const lines = wrap(words, mid, width);
    const count = (lines ? lines.length : 80) + head.length;
    if (lines && count * mid * LH <= height - 4) { best = { px: mid, lines }; lo = mid; }
    else hi = mid;
  }
  if (!best) best = { px: 14, lines: wrap(words, 14, width) || [words.map((w) => ({ ...w, k: 0 }))] };
  let lines = fill(rebalance(best.lines, best.px, width), best.px, width);
  paint(best.px, head, lines);
  let guard = 0;
  const tooBig = () => pageEl.scrollHeight > pageEl.clientHeight + 2;
  while (tooBig() && best.px > 12 && guard < 14) {
    best.px *= 0.92;
    const again = wrap(words, best.px, width);
    if (!again) break;
    lines = fill(rebalance(again, best.px, width), best.px, width);
    paint(best.px, head, lines);
    guard++;
  }
}
async function start() {
  try { await document.fonts.load('32px "' + FONT + '"'); } catch (e) {}
  await document.fonts.ready;
  fit();
}
start();
window.addEventListener("resize", fit);
</script>
</body>
</html>
