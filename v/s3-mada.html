const FONT = "Mada";
const page = document.getElementById("page");
function build() {
  page.replaceChildren();
  page.style.fontFamily = '"' + FONT + '", "Noto Naskh Arabic", serif';
  for (const ln of LINES) {
    const row = document.createElement("div");
    if (ln.t === "h") { row.className = "line head"; row.textContent = ln.s; }
    else if (ln.t === "b") { row.className = "line basmala"; row.textContent = ln.s; }
    else {
      row.className = "line" + (ln.w.length < 4 ? " short" : "");
      ln.w.forEach((word) => {
        const s = document.createElement("span");
        s.textContent = word.w;
        if (word.n) {
          const n = document.createElement("span");
          n.className = "num";
          n.textContent = word.n;
          s.append(n);
        }
        row.append(s);
      });
    }
    page.append(row);
  }
}
function fit() {
  const height = page.clientHeight;
  const width = page.clientWidth;
  let px = Math.max(14, height / (LINES.length * 2.05));
  page.style.fontSize = px + "px";
  for (let i = 0; i < 16; i++) {
    const over = [...page.children].some((el) => el.scrollWidth > width + 1) || page.scrollHeight > height + 1;
    if (!over) break;
    px *= 0.92;
    page.style.fontSize = px + "px";
  }
}
async function start() {
  build();
  try { await document.fonts.load('32px "' + FONT + '"'); } catch (e) {}
  await document.fonts.ready;
  fit();
}
start();
window.addEventListener("resize", fit);
