  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fffaf0; color: #142824; }
    .hud { position: fixed; z-index: 2; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; background: #fffaf0; font: 650 13px "Segoe UI", sans-serif; color: #8a6a2e; }
    .hud a { color: #12352c; text-decoration: none; padding: 8px; }
    .hud a.nav { font-size: 22px; line-height: 1; }
    .hud b { flex: 1; text-align: center; font-size: 13px; white-space: nowrap; overflow: hidden; }
    #frame { position: fixed; top: 40px; right: 10px; left: 10px; bottom: 8px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-evenly; }
    .line { display: flex; align-items: center; direction: rtl; width: 100%; white-space: nowrap; font-family: "Noto Naskh Arabic", "Noto Naskh Arabic", serif; }
    .line.full { justify-content: space-between; }
    .line.mid { justify-content: center; }
    .mark { color: #8a6a2e; }
    #probe { position: absolute; left: -9999px; top: 0; white-space: nowrap; font-family: "Noto Naskh Arabic", "Noto Naskh Arabic", serif; }
  </style>
</head>
<body>
  <nav class="hud">
    <a href="../index.html?p=4">Siyahı</a>
    <a class="nav" href="./s4-scheherazade-new.html?v=3">‹</a>
    <b>Noto Naskh Arabic</b>
    <a class="nav" href="./s4-lateef.html?v=3">›</a>
    <span style="padding-right:8px">4/5</span>
  </nav>
  <div id="frame"></div>
  <span id="probe"></span>
  <script>
    const PAGE = {"n": 4, "surah": "əl-Bəqərə", "ar": "البقرة", "place": "Mədinə", "range": "2:17–24", "basmala": null, "showTitle": false, "ayahs": [{"s": 2, "a": 17, "t": "مَثَلُهُمْ كَمَثَلِ ٱلَّذِى ٱسْتَوْقَدَ نَارًا فَلَمَّآ أَضَآءَتْ مَا حَوْلَهُۥ ذَهَبَ ٱللَّهُ بِنُورِهِمْ وَتَرَكَهُمْ فِى ظُلُمَٰتٍ لَّا يُبْصِرُونَ"}, {"s": 2, "a": 18, "t": "صُمٌّۢ بُكْمٌ عُمْىٌ فَهُمْ لَا يَرْجِعُونَ"}, {"s": 2, "a": 19, "t": "أَوْ كَصَيِّبٍ مِّنَ ٱلسَّمَآءِ فِيهِ ظُلُمَٰتٌ وَرَعْدٌ وَبَرْقٌ يَجْعَلُونَ أَصَٰبِعَهُمْ فِىٓ ءَاذَانِهِم مِّنَ ٱلصَّوَٰعِقِ حَذَرَ ٱلْمَوْتِ وَٱللَّهُ مُحِيطٌۢ بِٱلْكَٰفِرِينَ"}, {"s": 2, "a": 20, "t": "يَكَادُ ٱلْبَرْقُ يَخْطَفُ أَبْصَٰرَهُمْ كُلَّمَآ أَضَآءَ لَهُم مَّشَوْا۟ فِيهِ وَإِذَآ أَظْلَمَ عَلَيْهِمْ قَامُوا۟ وَلَوْ شَآءَ ٱللَّهُ لَذَهَبَ بِسَمْعِهِمْ وَأَبْصَٰرِهِمْ إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍ قَدِيرٌ"}, {"s": 2, "a": 21, "t": "يَٰٓأَيُّهَا ٱلنَّاسُ ٱعْبُدُوا۟ رَبَّكُمُ ٱلَّذِى خَلَقَكُمْ وَٱلَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ"}, {"s": 2, "a": 22, "t": "ٱلَّذِى جَعَلَ لَكُمُ ٱلْأَرْضَ فِرَٰشًا وَٱلسَّمَآءَ بِنَآءً وَأَنزَلَ مِنَ ٱلسَّمَآءِ مَآءً فَأَخْرَجَ بِهِۦ مِنَ ٱلثَّمَرَٰتِ رِزْقًا لَّكُمْ فَلَا تَجْعَلُوا۟ لِلَّهِ أَندَادًا وَأَنتُمْ تَعْلَمُونَ"}, {"s": 2, "a": 23, "t": "وَإِن كُنتُمْ فِى رَيْبٍ مِّمَّا نَزَّلْنَا عَلَىٰ عَبْدِنَا فَأْتُوا۟ بِسُورَةٍ مِّن مِّثْلِهِۦ وَٱدْعُوا۟ شُهَدَآءَكُم مِّن دُونِ ٱللَّهِ إِن كُنتُمْ صَٰدِقِينَ"}, {"s": 2, "a": 24, "t": "فَإِن لَّمْ تَفْعَلُوا۟ وَلَن تَفْعَلُوا۟ فَٱتَّقُوا۟ ٱلنَّارَ ٱلَّتِى وَقُودُهَا ٱلنَّاسُ وَٱلْحِجَارَةُ أُعِدَّتْ لِلْكَٰفِرِينَ"}]};
    const FONT = "Noto Naskh Arabic";
    const LH = 1.9;
    const ar = (n) => String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
    const frame = document.getElementById("frame");
    const probe = document.getElementById("probe");
    const measure = (text, px) => { probe.style.fontSize = px + "px"; probe.textContent = text; return probe.getBoundingClientRect().width; };
    function pieces() {
      const head = [];
      if (PAGE.showTitle) head.push("سورة " + PAGE.ar);
      if (PAGE.basmala) head.push(PAGE.basmala);
      const words = [];
      for (const ay of PAGE.ayahs) {
        const ws = ay.t.split(/\s+/).filter(Boolean);
        ws.forEach((w, i) => words.push(i === ws.length - 1 ? w + "\u00a0﴿" + ar(ay.a) + "﴾" : w));
      }
      return { head, words };
    }
    function wrap(words, px, width) {
      const lines = []; let cur = [], used = 0; const gap = px * 0.45;
      for (const w of words) {
        const ww = measure(w, px);
        if (ww > width) return null;
        const next = used + (cur.length ? gap : 0) + ww;
        if (cur.length && next > width) { lines.push(cur); cur = [w]; used = ww; }
        else { cur.push(w); used = next; }
      }
      if (cur.length) lines.push(cur);
      return lines;
    }
    function widthOf(line, px) {
      const gap = px * 0.45;
      return line.reduce((s, w) => s + measure(w, px), 0) + gap * Math.max(0, line.length - 1);
    }
    function rebalance(lines, px, width) {
      for (let n = 0; n < 12 && lines.length > 1; n++) {
        const last = lines[lines.length - 1];
        const prev = lines[lines.length - 2];
        if (prev.length < 2) break;
        if (widthOf(last, px) >= width * 0.72) break;
        const moved = prev[prev.length - 1];
        if (widthOf(last.concat(moved), px) > width) break;
        last.unshift(prev.pop());
      }
      return lines;
    }
    function paint(px, head, lines) {
      frame.replaceChildren();
      frame.style.fontSize = px + "px";
      const add = (text, cls) => {
        const el = document.createElement("div");
        el.className = "line " + cls;
        el.style.fontSize = px + "px";
        el.style.lineHeight = String(LH);
        if (cls === "full") {
          text.forEach((w) => {
            const s = document.createElement("span");
            const m = w.split("\u00a0");
            s.append(document.createTextNode(m[0]));
            if (m[1]) { const k = document.createElement("span"); k.className = "mark"; k.textContent = "\u00a0" + m[1]; s.append(k); }
            el.append(s);
          });
        } else el.textContent = text;
        frame.append(el);
      };
      head.forEach((t) => add(t, "mid"));
      lines.forEach((line) => add(line, line.length > 1 ? "full" : "mid"));
    }
    function fit() {
      const { head, words } = pieces();
      const height = Math.max(180, frame.clientHeight || window.innerHeight - 48);
      const width = Math.max(160, frame.clientWidth || window.innerWidth - 20);
      let lo = 13, hi = Math.min(40, width / 9), best = null;
      for (let i = 0; i < 14; i++) {
        const mid = (lo + hi) / 2;
        const lines = wrap(words, mid, width - 4);
        const count = (lines ? lines.length : 99) + head.length;
        if (lines && count * mid * LH <= height) { best = { px: mid, lines }; lo = mid; }
        else hi = mid;
      }
      if (!best) best = { px: 14, lines: wrap(words, 14, width - 4) || [words] };
      best.lines = rebalance(best.lines, best.px, width - 4);
      paint(best.px, head, best.lines);
      let guard = 0;
      while (frame.scrollHeight > height + 2 && best.px > 12 && guard < 10) {
        best.px *= 0.94;
        const lines = wrap(words, best.px, width - 4) || best.lines;
        paint(best.px, head, rebalance(lines, best.px, width - 4));
        guard++;
      }
    }
    async function start() {
      try { await document.fonts.load('32px "' + FONT + '"'); } catch (e) {}
      await document.fonts.ready;
      fit();
    }
    start();
    window.addEventListener("resize", fit);
  </script>
</body>
</html>
