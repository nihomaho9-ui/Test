const FONT = "Markazi Text";
const PAGE = 5;
const board = document.getElementById("page");
const probe = document.getElementById("probe");
const CAN = new Set("بتثجحخسشصضطظعغفقكلمنهيئىة".split(""));
const measure = (text, px) => { probe.style.fontSize = px + "px"; probe.textContent = text; return probe.getBoundingClientRect().width; };
function clusters(word) { const out = []; for (const ch of word) { if (/\p{M}/u.test(ch) && out.length) out[out.length-1] += ch; else out.push(ch); } return out; }
function base(c) { return c.normalize("NFD").replace(/\p{M}/gu, ""); }
function spots(word) { const c = clusters(word); const idx = []; for (let i = 0; i < c.length - 1; i++) if (CAN.has(base(c[i]))) idx.push(i); return { c, idx }; }
function stretch(word, n) {
  const { c, idx } = spots(word);
  if (!idx.length || n <= 0) return word;
  const extra = idx.map(() => 0);
  for (let k = 0; k < n; k++) extra[k % idx.length]++;
  const parts = c.slice();
  for (let i = idx.length - 1; i >= 0; i--) if (extra[i]) parts[idx[i]] += "ـ".repeat(Math.min(extra[i], 3));
  return parts.join("");
}
function lineText(ln, px) {
  if (ln.t !== "l") return ln.s;
  return ln.w.map((word) => stretch(word.w, word.k || 0) + (word.n ? " " + word.n : "")).join(" ");
}
function lineWidth(ln, px) {
  if (ln.t !== "l") return 0;
  const gap = px * 0.35;
  return ln.w.reduce((s, word, i) => s + measure(stretch(word.w, word.k || 0), px) + (word.n ? measure(word.n, px * 0.62) : 0) + (i ? gap : 0), 0);
}
function even(px, width) {
  const text = LINES.filter((ln) => ln.t === "l");
  text.forEach((ln) => ln.w.forEach((w) => w.k = 0));
  let widest = 0;
  text.forEach((ln) => { widest = Math.max(widest, lineWidth(ln, px)); });
  const goal = Math.min(width * 0.98, widest);
  for (const ln of text) {
    if (ln.w.length < 3) continue;
    let guard = 0;
    while (lineWidth(ln, px) < goal * 0.97 && guard < 24) {
      const order = ln.w.map((w, i) => ({ i, s: spots(w.w).idx.length, k: w.k || 0 })).filter((x) => x.s && x.k < x.s * 2);
      if (!order.length) break;
      order.sort((a, b) => a.k - b.k);
      const before = lineWidth(ln, px);
      ln.w[order[0].i].k = (ln.w[order[0].i].k || 0) + 1;
      if (lineWidth(ln, px) > goal) { ln.w[order[0].i].k--; break; }
      if (lineWidth(ln, px) <= before + 0.2) { ln.w[order[0].i].k--; break; }
      guard++;
    }
  }
}
function paint(px) {
  board.replaceChildren();
  board.style.fontSize = px + "px";
  const mid = PAGE <= 2;
  board.classList.toggle("mid", mid);
  const rows = [];
  for (const ln of LINES) {
    const row = document.createElement("div");
    row.style.fontSize = px + "px";
    if (ln.t === "h" && PAGE <= 2) {
      row.className = "line surah";
      const head = document.createElement("div"); head.className = "shead";
      const img = document.createElement("img"); img.src = "../fonts/surah-banner.png"; img.alt = "";
      const names = document.createElement("span"); names.className = "snames";
      const word = document.createElement("span"); word.className = "sname"; word.textContent = "\uE000";
      const name = document.createElement("span"); name.className = "sname"; name.textContent = String.fromCharCode(0xE000 + PAGE);
      names.append(word, name); head.append(img, names); row.append(head);
    } else if (ln.t === "h") {
      row.className = "line"; row.textContent = ln.s;
    } else if (ln.t === "b") {
      row.className = "line"; row.textContent = ln.s;
    } else {
      row.className = "line";
      ln.w.forEach((word, i) => {
        const s = document.createElement("span");
        s.textContent = stretch(word.w, word.k || 0);
        if (word.n) { const n = document.createElement("span"); n.className = "ayah"; n.textContent = word.n; s.append(n); }
        row.append(s);
      });
    }
    rows.push(row);
  }
  if (mid) board.style.setProperty("--half", String(Math.max(1, (rows.length - 1) / 2)));
  rows.forEach((r) => board.append(r));
  const head = board.querySelector(".shead");
  if (head) {
    let ink = 0;
    board.querySelectorAll(".line:not(.surah)").forEach((l) => { ink = Math.max(ink, l.scrollWidth); });
    if (ink) head.style.width = Math.min(board.clientWidth * 0.94, Math.max(ink, board.clientWidth * 0.72)) + "px";
    const names = board.querySelector(".snames");
    if (names) {
      let s = head.clientHeight * 0.42;
      names.style.fontSize = s + "px";
      if (names.scrollWidth > head.clientWidth * 0.62) names.style.fontSize = (s * head.clientWidth * 0.62 / names.scrollWidth) + "px";
    }
  }
}
function fit() {
  const width = Math.max(120, board.clientWidth - 16);
  const height = Math.max(160, board.clientHeight);
  let px = height / (PAGE <= 2 ? 12 : 17);
  for (let i = 0; i < 18; i++) {
    LINES.forEach((ln) => ln.t === "l" && ln.w.forEach((w) => w.k = 0));
    const widest = Math.max(...LINES.filter((ln) => ln.t === "l").map((ln) => lineWidth(ln, px)), 0);
    const count = LINES.length;
    if (widest > width || count * px * 1.25 > height) px *= 0.92;
    else break;
  }
  even(px, width);
  paint(px);
  let guard = 0;
  while (guard < 6 && [...board.querySelectorAll(".line")].some((l) => l.scrollWidth > l.clientWidth + 2)) {
    px *= 0.94;
    LINES.forEach((ln) => ln.t === "l" && ln.w.forEach((w) => w.k = 0));
    even(px, width);
    paint(px);
    guard++;
  }
}
async function start() {
  try {
    await document.fonts.load('28px "' + FONT + '"');
    const face = new FontFace("surahnames", "url(../fonts/sura_names.woff2)");
    document.fonts.add(await face.load());
  } catch (e) {}
  await document.fonts.ready;
  fit();
}
start();
window.addEventListener("resize", fit);
