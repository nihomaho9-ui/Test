<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Quran səhifəsi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Amiri+Quran&family=Amiri:wght@400;700&family=Aref+Ruqaa+Ink&family=Aref+Ruqaa:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;700&family=Cairo:wght@400;600&family=El+Messiri:wght@500;700&family=Fustat:wght@400;700&family=Gulzar&family=Harmattan:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600&family=Katibeh&family=Kufam:wght@500;700&family=Lateef:wght@400;700&family=Lemonada:wght@400;600&family=Mada:wght@400;600&family=Markazi+Text:wght@500;600&family=Marhey:wght@500;700&family=Mirza:wght@500;700&family=Noto+Kufi+Arabic:wght@500;700&family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Nastaliq+Urdu:wght@500;700&family=Noto+Sans+Arabic:wght@400;600&family=Playpen+Sans+Arabic:wght@500;700&family=Readex+Pro:wght@400;600&family=Reem+Kufi:wght@500;700&family=Scheherazade+New:wght@400;700&family=Tajawal:wght@400;700&family=Zain:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fffaf0; color: #142824; }
    #sheet {
      position: fixed; inset: 0;
      padding: calc(2.3rem + env(safe-area-inset-top)) 0.7rem calc(0.4rem + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; justify-content: space-evenly;
    }
    .line {
      flex: 1 1 0; min-height: 0; width: 100%;
      display: flex; align-items: center; justify-content: center;
      direction: rtl; white-space: nowrap; overflow: hidden;
    }
    .line.full { justify-content: space-between; }
    .line .mark { color: #8a6a2e; }
    .hud {
      position: fixed; z-index: 2; top: 0; left: 0; right: 0;
      display: flex; align-items: center; gap: 0.2rem;
      padding: calc(0.1rem + env(safe-area-inset-top)) 0.3rem 0.6rem;
      background: linear-gradient(#fffaf0 55%, rgba(255, 250, 240, 0));
      font: 650 0.78rem "Segoe UI", sans-serif; color: #8a6a2e;
    }
    .hud a, .hud button {
      color: #12352c; background: none; border: 0; text-decoration: none;
      font: inherit; font-size: 1.15rem; cursor: pointer; padding: 0.15rem 0.3rem;
    }
    .hud a { font-size: 0.78rem; }
    .hud b { flex: 1; text-align: center; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #probe { position: absolute; visibility: hidden; white-space: nowrap; pointer-events: none; }
  </style>
</head>
<body>
  <nav class="hud">
    <a id="back" href="./index.html">Siyahı</a>
    <button type="button" id="prev" aria-label="Əvvəlki">‹</button>
    <b id="title"></b>
    <button type="button" id="next" aria-label="Növbəti">›</button>
    <span id="pg"></span>
  </nav>
  <main id="sheet"></main>
  <span id="probe"></span>
  <script>
    const FONTS = ["Amiri Quran","Amiri","Scheherazade New","Noto Naskh Arabic","Lateef","Harmattan","Markazi Text","Readex Pro","El Messiri","IBM Plex Sans Arabic","Noto Sans Arabic","Cairo","Tajawal","Almarai","Mada","Zain","Fustat","Lemonada","Playpen Sans Arabic","Marhey","Baloo Bhaijaan 2","Katibeh","Noto Nastaliq Urdu","Gulzar","Mirza","Aref Ruqaa","Aref Ruqaa Ink","Noto Kufi Arabic","Reem Kufi","Kufam"];
    const ar = (n) => String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
    const qs = new URLSearchParams(location.search);
    let pageNo = Math.min(5, Math.max(1, Number(qs.get("p")) || 1));
    let font = qs.get("f") || FONTS[0];
    if (!FONTS.includes(font)) font = FONTS[0];
    const sheet = document.getElementById("sheet");
    const probe = document.getElementById("probe");
    let PAGES = [];
    function href(p, f) { return "./view.html?p=" + p + "&f=" + encodeURIComponent(f); }
    function measure(text, px) {
      probe.style.font = px + 'px "' + font + '", serif';
      probe.textContent = text;
      return probe.offsetWidth;
    }
    function tokensOf(page) {
      const out = [];
      if (page.showTitle) out.push({ text: "سورة " + page.ar, center: true });
      if (page.basmala) out.push({ text: page.basmala, center: true });
      for (const ay of page.ayahs) {
        const words = ay.t.split(/\s+/).filter(Boolean);
        words.forEach((w, i) => out.push({ text: w + (i === words.length - 1 ? " ﴿" + ar(ay.a) + "﴾" : ""), center: false }));
      }
      return out;
    }
    function wrap(tokens, px, width) {
      const lines = [];
      let cur = [];
      let used = 0;
      const gap = px * 0.35;
      for (const tok of tokens) {
        if (tok.center) {
          if (cur.length) { lines.push({ words: cur, center: false }); cur = []; used = 0; }
          lines.push({ words: [tok.text], center: true });
          continue;
        }
        const w = measure(tok.text, px);
        if (w > width) return null;
        const next = used + (cur.length ? gap : 0) + w;
        if (cur.length && next > width) {
          lines.push({ words: cur, center: false });
          cur = [tok.text];
          used = w;
        } else {
          cur.push(tok.text);
          used = next;
        }
      }
      if (cur.length) lines.push({ words: cur, center: false });
      return lines;
    }
    function show() {
      const page = PAGES[pageNo - 1];
      document.getElementById("title").textContent = font;
      document.getElementById("pg").textContent = pageNo + " / 5";
      document.title = font + " · səhifə " + pageNo;
      history.replaceState(null, "", href(pageNo, font));
      document.getElementById("back").href = "./index.html?p=" + pageNo;
      const tokens = tokensOf(page);
      const width = sheet.clientWidth - 4;
      const height = sheet.clientHeight;
      let lo = 8, hi = Math.min(width / 4, height / 4), best = null;
      for (let i = 0; i < 16; i++) {
        const mid = (lo + hi) / 2;
        const lines = wrap(tokens, mid, width);
        if (lines && lines.length * mid * 1.15 <= height) { best = { px: mid, lines }; lo = mid; }
        else hi = mid;
      }
      if (!best) best = { px: 12, lines: wrap(tokens, 12, width) || [{ words: tokens.map((t) => t.text), center: false }] };
      sheet.replaceChildren();
      sheet.style.fontFamily = '"' + font + '", serif';
      for (const line of best.lines) {
        const el = document.createElement("div");
        el.className = "line" + (!line.center && line.words.length > 1 ? " full" : "");
        el.style.fontSize = best.px + "px";
        line.words.forEach((w) => {
          const s = document.createElement("span");
          const m = w.match(/^(.*?)( ﴿.+﴾)$/);
          if (m) { s.append(m[1]); const k = document.createElement("span"); k.className = "mark"; k.textContent = m[2]; s.append(k); }
          else s.textContent = w;
          el.append(s);
        });
        sheet.append(el);
      }
    }
    function step(dir) {
      let i = FONTS.indexOf(font) + dir;
      if (i < 0) { i = FONTS.length - 1; pageNo = pageNo <= 1 ? 5 : pageNo - 1; }
      if (i >= FONTS.length) { i = 0; pageNo = pageNo >= 5 ? 1 : pageNo + 1; }
      font = FONTS[i];
      show();
    }
    document.getElementById("prev").onclick = () => step(-1);
    document.getElementById("next").onclick = () => step(1);
    window.addEventListener("resize", show);
    fetch("./data/pages.json").then((r) => r.json()).then(async (pages) => {
      PAGES = pages;
      await document.fonts.ready;
      show();
      setTimeout(show, 400);
    });
  </script>
</body>
</html>
